[project]
name = "oci-mcp"
version = "0.1.0"
description = "MCP server for operating Oracle Cloud Infrastructure"
readme = "README.md"
# Upper bound is deliberate: the oci SDK publishes classifiers only through 3.13
# and pins urllib3/cryptography/pyOpenSSL ranges. 3.14 will not resolve.
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastmcp>=4.0.3",
    "oci>=2.185.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Keep in step with the ruff rev pinned in .pre-commit-config.yaml, so the
    # hooks and CI enforce identical rules.
    "ruff==0.16.7",
    "pre-commit>=4",
]

[project.scripts]
oci-mcp = "oci_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oci_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    # Collapsing a multi-line if/else into a ternary is not always clearer;
    # reads.get_resource's bucket special case reads better as a block.
    "SIM108",
]
